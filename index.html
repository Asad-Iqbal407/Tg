<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>कर्ण अर्जुन युद्ध</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="कुरुक्षेत्र के सत्रहवें दिन कर्ण और अर्जुन का महासंग्राम — दिव्यास्त्र, हिंदी संवाद और पार्श्व-संगीत के साथ एक एनिमेटेड फ़िल्म।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700&family=Rozha+One&family=Tiro+Devanagari+Hindi&display=swap">
<style>
  /* Layout: a dark cinema hall — the film frame up top, the chapter strip under it, then the reference pages like a printed programme. */
  :root {
    --night: #0b0c13;      /* hall */
    --panel: #141623;      /* raised surfaces */
    --ink: #ece3cf;        /* parchment text */
    --ash: #a29cab;        /* secondary text */
    --brass: #d9a449;      /* accent: temple brass */
    --sindoor: #d0582f;    /* warning / emphasis */
    --line: rgba(217, 164, 73, .24);
    --display: "Rozha One", "Tiro Devanagari Hindi", "Noto Serif Devanagari", serif;
    --serif: "Tiro Devanagari Hindi", "Noto Serif Devanagari", "Nirmala UI", serif;
    --sans: "Mukta", "Noto Sans Devanagari", "Nirmala UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--night); }
  body {
    margin: 0; background: var(--night); color: var(--ink);
    font: 400 17px/1.65 var(--sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 48px;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .wrap { max-width: 1180px; margin: 0 auto; }

  .masthead { max-width: 1180px; margin: 0 auto; padding-block: 26px 16px; }
  h1 { margin: 0; font: 400 clamp(40px, 7vw, 76px)/1.05 var(--display); text-wrap: balance;
       background: linear-gradient(180deg, #fff3d0 10%, #e7ac4c 60%, #9a5a1c); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ----- theatre ----- */
  .theatre { max-width: 1180px; margin: 0 auto; }
  .frame { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; container-type: inline-size; border-radius: 4px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(217,164,73,.12); }
  #film { display: block; width: 100%; height: 100%; cursor: pointer; }
  .ov { position: absolute; pointer-events: none; opacity: 0; will-change: opacity, transform; }

  .sub { left: 7%; right: 7%; bottom: 1.3cqw; display: flex; flex-direction: column; align-items: center; gap: .25cqw; text-align: center; }
  .sub .who { font: 500 clamp(10px, 1.3cqw, 25px)/1.2 var(--sans); letter-spacing: .08em; text-shadow: 0 0 .5cqw #000; }
  .sub .line { font: 400 clamp(13px, 2.4cqw, 46px)/1.38 var(--serif); color: #fff7e8; text-wrap: balance; text-shadow: 0 0 .7cqw #000, 0 .12cqw .3cqw #000, 0 0 1.6cqw rgba(0,0,0,.8); }
  .sub[data-who="KR"] .line { font-style: normal; }
  .caption { left: 3cqw; bottom: 9cqw; font: 500 clamp(10px, 1.5cqw, 28px)/1.3 var(--sans); color: #ffe2b0; letter-spacing: .03em; text-shadow: 0 0 .6cqw #000; border-left: .25cqw solid var(--brass); padding-left: 1cqw; }
  .card { top: 9.4cqw; width: min(38cqw, 520px); display: grid; gap: .35cqw; --acc: var(--brass); text-shadow: 0 0 .8cqw rgba(0,0,0,.9), 0 0 .2cqw #000; }
  .card.left { left: 4.5cqw; } .card.right { right: 4.5cqw; text-align: right; }
  .card .kicker { font: 500 clamp(9px, 1.2cqw, 23px)/1 var(--sans); letter-spacing: .2em; color: var(--acc); }
  .card .title { font: 400 clamp(20px, 5.2cqw, 100px)/1.05 var(--display); color: #fff6df; text-shadow: 0 0 2.5cqw var(--acc), 0 0 .6cqw rgba(0,0,0,.8); }
  .card .roman { font: 400 clamp(9px, 1.35cqw, 26px)/1.2 var(--sans); color: #e6d6b8; letter-spacing: .05em; padding-bottom: .5cqw; border-bottom: .12cqw solid var(--acc); }
  .card .rows { margin: .4cqw 0 0; display: grid; grid-template-columns: auto 1fr; gap: .25cqw 1.1cqw; font: 400 clamp(9px, 1.5cqw, 29px)/1.35 var(--sans); }
  .card.right .rows { grid-template-columns: 1fr auto; }
  .card dt { color: var(--acc); } .card dd { margin: 0; color: #f6ecd8; }
  @container (max-width: 520px) { .card .rows dt { display: none; } .card .rows, .card.right .rows { grid-template-columns: 1fr; } }

  .start { position: absolute; inset: 0; display: grid; place-content: end center; justify-items: center; gap: 8px; text-align: center; padding-bottom: 8.5cqw;
           background: linear-gradient(180deg, rgba(5,4,8,0) 40%, rgba(5,4,8,.78)); }
  .bigplay { display: inline-flex; align-items: center; gap: 14px; padding: 12px 26px 12px 14px; border-radius: 999px; cursor: pointer;
             background: rgba(14,12,18,.72); border: 1px solid rgba(217,164,73,.65); font: 500 clamp(17px, 2.4cqw, 26px)/1 var(--sans); color: #fff1d6; backdrop-filter: blur(6px); }
  .bigplay:hover { background: rgba(40,28,14,.82); }
  .bigplay .disc { width: clamp(38px, 6cqw, 64px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(180deg, #f4c66e, #b26b22); color: #1a0f05; }
  .bigplay svg { width: 42%; margin-left: 8%; }
  .hint { margin: 0; font: 400 clamp(12px, 1.6cqw, 16px)/1.4 var(--sans); color: #e3d6bd; text-shadow: 0 0 6px #000; max-width: 46ch; padding-inline: 12px; }

  .controls { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 6px 10px; padding: 10px 2px 4px; }
  .ctl { display: inline-grid; place-items: center; min-width: 40px; height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--ink); gap: 6px; grid-auto-flow: column; font: 500 14px/1 var(--sans); }
  .ctl:hover { background: var(--panel); border-color: var(--line); }
  .ctl svg { width: 20px; height: 20px; }
  .ctl[aria-pressed="true"] { color: var(--brass); border-color: var(--line); }
  .ctl:disabled { opacity: .4; cursor: not-allowed; }
  #btnPlay .i-pause { display: none; } #btnPlay[data-state="pause"] .i-pause { display: block; } #btnPlay[data-state="pause"] .i-play { display: none; }
  .track { position: relative; min-width: 0; height: 40px; display: flex; align-items: center; }
  #seek { width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; height: 40px; cursor: pointer; --p: 0%; }
  #seek::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--brass) var(--p), rgba(236,227,207,.18) var(--p)); }
  #seek::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(236,227,207,.18); }
  #seek::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--brass); }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff1d6; border: 2px solid var(--brass); }
  #seek::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff1d6; border: 2px solid var(--brass); }
  .time { font: 500 14px/1 var(--sans); color: var(--ash); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .theatre:fullscreen { background: #000; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; }
  .theatre:fullscreen .frame { width: min(100%, calc((100vh - 70px) * 16 / 9)); margin: 0 auto; border-radius: 0; }
  .theatre:fullscreen .controls { width: min(100%, calc((100vh - 70px) * 16 / 9)); margin: 0 auto; }

  /* ----- offline renderer (MP4) ----- */
  body.render { padding: 0; margin: 0; overflow: hidden; background: #000; }
  body.render > :not(.theatre), body.render .controls, body.render .start, body.render script { display: none !important; }
  body.render .theatre { max-width: none; width: 1920px; margin: 0; }
  body.render .frame { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
  @media (prefers-reduced-motion: reduce) { .chap, .ctl { transition: none; } }
</style>
</head>
<body>
<header class="masthead">
  <h1>कर्ण अर्जुन युद्ध</h1>
</header>

<section class="theatre" id="theatre" aria-label="फ़िल्म">
  <div class="frame" id="frame">
    <canvas id="film" width="1920" height="1080" aria-label="कर्ण अर्जुन युद्ध — एनिमेटेड फ़िल्म"></canvas>
    <div class="ov card left" id="ovCard"><div class="kicker"></div><div class="title"></div><div class="roman"></div><dl class="rows"></dl></div>
    <div class="ov caption" id="ovCap"></div>
    <div class="ov sub" id="ovSub" aria-live="polite"><span class="who" id="ovWho"></span><span class="line" id="ovLine"></span></div>
    <div class="start" id="start">
      <button id="btnStart" class="bigplay" type="button">
        <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3.5v17l14-8.5z"/></svg></span>
        <span id="startLabel">फ़िल्म देखें</span>
      </button>
      <p class="hint"><span id="dur">९ मिनट</span></p>
    </div>
  </div>
  <div class="controls">
    <button class="ctl" id="btnPlay" type="button" data-state="play" aria-label="चलाएँ" title="चलाएँ / रोकें (Space)">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4v16l13-8z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <div class="track"><input id="seek" type="range" min="0" max="400" step="0.1" value="0" aria-label="फ़िल्म में समय"></div>
    <span class="time" id="time">0:00 / 0:00</span>
    <button class="ctl" id="btnFs" type="button" aria-label="पूर्ण स्क्रीन" title="पूर्ण स्क्रीन (F)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</section>


<script src="js/engine.js"></script>
<script src="js/voices.js"></script>
<script src="js/script.js"></script>
<script src="js/shots.js"></script>
<script src="js/audio.js"></script>
<script src="js/player.js"></script>
</body>
</html>
