server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;

  # Docker's DNS. The API host is looked up when a request arrives, not at startup: a literal proxy_pass host
  # stops nginx from starting when there is no api service, which would break the image on its own.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

  # A `types` block replaces the inherited map, so re-include the defaults first.
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Content-hashed bundles never change: cache for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Source maps are for error-tracking uploads only.
  location ~* \.map$ {
    return 404;
  }

  # The service worker and the HTML shell must always be revalidated so deploys roll out.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # The API shares this origin. nginx does not inherit add_header, so the security headers are re-included here.
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    # The API sends these two as well. Drop its copies so each header appears once.
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    client_max_body_size 256k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Replace any address the client sent. nginx is the only hop the API trusts (TRUST_PROXY).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    set $api_upstream http://api:8787;
    proxy_pass $api_upstream;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
