server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

  # A `types` block replaces the inherited map, so re-include the defaults first.
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Content-hashed bundles never change: cache for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Source maps are for error-tracking uploads only.
  location ~* \.map$ {
    return 404;
  }

  # The service worker and the HTML shell must always be revalidated so deploys roll out.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
