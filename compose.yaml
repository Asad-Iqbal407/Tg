# Runs the static site and the API together on one host.
#
# The api service needs MONGODB_URI in .env. Copy .env.example to .env and replace the placeholder with your
# Atlas connection string, or set the variables as secrets on your platform and remove env_file.
#
#   cp .env.example .env
#   docker compose up --build        # http://localhost:8080
#
# Only web is published. nginx forwards /api to the api service, which listens on api:8787 inside the network.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # MONGODB_URI comes from .env. Values set under environment below win over the file.
    env_file: .env
    environment:
      # The origin users see in the browser. Cross-origin writes are refused.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      # nginx is the only hop in front of the API, so its X-Forwarded-For can be trusted.
      TRUST_PROXY: 'true'
    expose:
      - '8787'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
